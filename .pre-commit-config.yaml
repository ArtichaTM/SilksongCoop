# Fast hygiene only; builds, analyzers and tests run in `make verify`.
default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      # Publishes the last built plugin for the loader.
      - id: publish-dll
        name: scp SilksongCoop.dll to raspi
        entry: scp src/SilksongCoop/bin/Release/netstandard2.1/SilksongCoop.dll raspi:/home/site/articha_site/static/shared/SilksongCoop.dll
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
  - repo: local
    hooks:
      - id: block-commits-to-main
        name: Block direct commits to main
        entry: bash scripts/block-commits-to-main.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

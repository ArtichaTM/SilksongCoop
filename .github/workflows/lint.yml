name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SilksongCoop.slnx --locked-mode

      # Analyzers and .editorconfig style; warnings fail this build.
      - name: Analyzers
        run: dotnet build SilksongCoop.slnx --no-restore -c Release

      - name: Whitespace
        run: dotnet format whitespace SilksongCoop.slnx --no-restore --verify-no-changes
